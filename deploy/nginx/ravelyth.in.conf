# =============================================================================
# Ravelyth Talent - nginx site configuration
# Target: Ubuntu 24.04, app on 127.0.0.1:3000, HTTPS via certbot
#
#   sudo cp deploy/nginx/ravelyth.in.conf /etc/nginx/sites-available/ravelyth.in
#   sudo ln -s /etc/nginx/sites-available/ravelyth.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Rate-limit zones (shared across the http/https servers).
limit_req_zone $binary_remote_addr zone=ravelyth_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ravelyth_auth:10m rate=5r/m;

upstream ravelyth_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---------------------------------------------------------------- HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ravelyth.in www.ravelyth.in;

    # Leave ACME challenges reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ravelyth.in$request_uri;
    }
}

# ---------------------------------------------------------------- www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.ravelyth.in;

    ssl_certificate     /etc/letsencrypt/live/ravelyth.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ravelyth.in/privkey.pem;

    return 301 https://ravelyth.in$request_uri;
}

# ---------------------------------------------------------------- Main site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ravelyth.in;

    # --- TLS (certbot writes these; ssl-cert-snakeoil is the pre-certbot default)
    ssl_certificate     /etc/letsencrypt/live/ravelyth.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ravelyth.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Payload limits. Resume uploads are capped at 5 MB in app code; the
    #     10m here leaves headroom for multipart overhead and future exports.
    client_max_body_size 10m;
    client_body_timeout 60s;

    # --- Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/x-javascript
        application/json application/xml application/rss+xml
        application/ld+json image/svg+xml font/woff font/woff2;

    # --- Security headers (next.config.ts sets the app-level headers too;
    #     these are the outer belt-and-braces layer).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Robots-Tag "index, follow" always;

    # --- Next.js needs these for server actions and streaming RSC responses.
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # --- Cron endpoints: localhost only (app also checks the header secret).
    location /api/internal/cron/ {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://ravelyth_app;
    }

    # --- Auth endpoints get a tighter limit.
    location ~ ^/api/auth/(login|register|otp|google|verify-email) {
        limit_req zone=ravelyth_auth burst=10 nodelay;
        proxy_pass http://ravelyth_app;
    }

    # --- Uploads and webhooks: no buffering, longer timeout.
    location /api/files/ {
        proxy_pass http://ravelyth_app;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /api/webhooks/ {
        proxy_pass http://ravelyth_app;
        proxy_buffering off;
    }

    # --- API: never cache.
    location /api/ {
        limit_req zone=ravelyth_api burst=40 nodelay;
        proxy_pass http://ravelyth_app;
        add_header Cache-Control "no-store" always;
    }

    # --- Immutable build assets: cache hard.
    location /_next/static/ {
        proxy_pass http://ravelyth_app;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Hashed uploads and other static files.
    location /uploads/ {
        alias /var/lib/ravelyth/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /logo.svg   { access_log off; log_not_found off; }

    # --- Everything else goes to Next.
    location / {
        proxy_pass http://ravelyth_app;
    }

    # --- Access/error logs
    access_log /var/log/nginx/ravelyth.access.log;
    error_log  /var/log/nginx/ravelyth.error.log;
}
